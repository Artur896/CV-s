<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>CV</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
    margin: 0;
    padding: 32px 40px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; color: #111827; }
  .contact { font-size: 13px; color: #4b5563; margin-bottom: 20px; }
  h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #1d4ed8;
    border-bottom: 2px solid #1d4ed8;
    padding-bottom: 4px;
    margin: 22px 0 10px;
  }
  p { font-size: 13px; line-height: 1.5; margin: 0 0 8px; }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill-chip {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .roles { font-size: 13px; }
  .role-item { margin-bottom: 4px; }
  .response-block { margin-bottom: 12px; }
  .response-category {
    font-size: 11px;
    text-transform: uppercase;
    color: #6b7280;
    margin-bottom: 2px;
  }
  .footer-note { font-size: 10px; color: #9ca3af; margin-top: 24px; }
</style>
</head>
<body>
  <h1>{{fullName}}</h1>
  <div class="contact">{{phone}}</div>

  <h2>Perfil profesional</h2>
  <p>{{profileSummary}}</p>

  <h2>Puestos compatibles</h2>
  <div class="roles">{{suggestedRoles}}</div>

  <h2>Habilidades</h2>
  <div class="skills">{{skills}}</div>

  <h2>Experiencia y respuestas destacadas</h2>
  {{responseBlocks}}

  <div class="footer-note">Generado a partir de una entrevista. {{sourceNote}}</div>
</body>
</html>
